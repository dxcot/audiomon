[workspace]
resolver = "3"
members = ["crates/core", "crates/host", "crates/receiver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
audiomon-core = { path = "crates/core" }
log = "0.4"

# The core simulation tests process minutes of audio; keep them fast in debug builds.
[profile.dev.package.audiomon-core]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
