[package]
name = "audiorast-receiver"
description = "Android receiver engine (loaded by the Kotlin app via JNI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "audiorast"
crate-type = ["cdylib", "rlib"]

[dependencies]
audiorast-core.workspace = true
log.workspace = true
rtrb = "0.4.0"

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4.1"
libc = "0.2"
