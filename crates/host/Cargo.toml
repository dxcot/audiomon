[package]
name = "audiorast-host"
description = "Windows sender: captures system audio and streams it to the phone"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "audiorast"
path = "src/main.rs"

[dependencies]
audiorast-core.workspace = true
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
hound = "3.5.1"
log.workspace = true
rusb = { version = "0.9.4", features = ["vendored"] }
tray-icon = "0.26.1"
wasapi = "0.26.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }
